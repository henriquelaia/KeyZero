name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jose@6 is ESM-only under Node 20 require(); Node 22+ is required.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/backend-test.log"
          grep -Eq '^(ℹ|#) tests [1-9][0-9]*$' "$RUNNER_TEMP/backend-test.log"
          grep -Eq '^(ℹ|#) fail 0$' "$RUNNER_TEMP/backend-test.log"

      - name: Frontend crypto tests
        working-directory: frontend
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/frontend-test.log"
          grep -Eq '^(ℹ|#) tests [1-9][0-9]*$' "$RUNNER_TEMP/frontend-test.log"
          grep -Eq '^(ℹ|#) fail 0$' "$RUNNER_TEMP/frontend-test.log"

      - name: Frontend build
        working-directory: frontend
        run: npm run build
